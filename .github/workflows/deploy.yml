# Push to master -> build the image, push it to GHCR, then (if VPS_DEPLOY is 'true') deploy it to the VPS.
# The VPS side is /usr/local/bin/deploy-haruna: it pulls the image, swaps the tag, waits until WhatsApp
# reports "Connection: open" and rolls back on failure. The WhatsApp session lives in a volume, so a
# deploy does not need re-pairing.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mchdfrhn/haruna-bot

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Repo variable VPS_DEPLOY=true switches the VPS deploy on; without it only the image is built.
    if: vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Never cancel a deploy that is half way (it would leave the swap unfinished); queue instead.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              "deploy@${VPS_HOST}" "deploy ${GITHUB_SHA::7}"
